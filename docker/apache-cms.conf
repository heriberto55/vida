DirectoryIndex index.html index.php

PassEnv CMS_DATA_DIR
PassEnv CMS_ADMIN_USER
PassEnv CMS_ADMIN_PASSWORD_HASH

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/data/pages>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

Alias /uploads /var/www/data/uploads

<Directory /var/www/data/uploads>
    Options -Indexes
    AllowOverride None
    Require all granted
    php_flag engine off
</Directory>

<DirectoryMatch "^/var/www/html/(\.git|cms/(sessions|backups))">
    Require all denied
</DirectoryMatch>

<FilesMatch "(\.bak|\.bak\.html|^\.DS_Store)$">
    Require all denied
</FilesMatch>
